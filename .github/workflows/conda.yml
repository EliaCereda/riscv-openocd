name: conda

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-musl }
          - { os: macos-15, platform: osx-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: osx-64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # to post the build log as a commit comment on failure
    steps:
      - uses: actions/checkout@v4
      - name: Install rattler-build
        run: |
          sudo curl -fsSL "https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-${{ matrix.target }}" \
            -o /usr/local/bin/rattler-build
          sudo chmod +x /usr/local/bin/rattler-build
          rattler-build --version
      - name: Build package
        run: |
          set -o pipefail
          rattler-build build --recipe recipe/recipe.yaml --output-dir output 2>&1 | tee build.log
      - name: Post build log as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failure on \`${{ matrix.platform }}\` (run ${GITHUB_RUN_ID}), last part of build.log:"
            echo '```'
            tail -c 40000 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } > comment.txt
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: output/**/*.conda
          if-no-files-found: error

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to prefix.dev, no API key needed
    steps:
      - uses: actions/download-artifact@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Upload packages to prefix.dev
        run: |
          for pkg in $(find . -name '*.conda'); do
            pixi exec rattler-build upload prefix -c eliacereda "$pkg"
          done
