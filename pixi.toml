[workspace]
name = "riscv-openocd"
description = "Recipe repo for the riscv-openocd conda package (GAP SDK debug/flash tool)"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
rattler-build = ">=0.40"

[tasks]
build = "rattler-build build --recipe recipe/recipe.yaml --output-dir output"
test = "rattler-build test --package-file"
