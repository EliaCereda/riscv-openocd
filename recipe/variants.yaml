# Build with conda-forge's compilers and sysroot so the package is built the
# same way as the rest of the conda ecosystem. gcc 13 matches the distro
# compiler this source was proven to build with (and predates gcc 14's
# implicit-function-declaration hard errors, which the 2020-era sources may
# trip); sysroot 2.28 sets the __glibc >=2.28 floor (== Pixi's default solve
# baseline, so consumers need no [system-requirements] override).
c_compiler_version: ["13"]
c_stdlib: ["sysroot"]
c_stdlib_version: ["2.28"]
