# Build with conda-forge's compilers and standard library so the package is
# built the same way as the rest of the conda ecosystem. On Linux gcc 13
# matches the distro compiler this source was proven to build with (and
# predates gcc 14's implicit-function-declaration hard errors, which the
# 2020-era sources may trip); the sysroot sets the __glibc >=2.28 floor
# (== Pixi's default solve baseline, so consumers need no
# [system-requirements] override). On macOS the same stdlib() mechanism
# selects the deployment target instead; clang is pinned to 18 to match the
# sibling toolchain repos (clang >= 16 diagnostics are additionally
# downgraded in build.sh).
c_compiler_version:
  - if: linux
    then: "13"
  - if: osx
    then: "18"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx
    then: "11.0"
